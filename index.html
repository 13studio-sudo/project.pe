<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>PROJECT-PE</title>
<style>
  :root{
    --bg:#ffffff; --fg:#000000; --border:#000000;
    --panel:#f4f4f4; --muted:#555555; --select:#d40000;
    --accent:#d97757; --accent-fg:#ffffff;
  }
  [data-theme="dark"]{
    --bg:#000000; --fg:#ffffff; --border:#3a3a3a;
    --panel:#0a0a0a; --muted:#888888; --select:#ff7a3c;
    --accent:#d97757; --accent-fg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
  *,*::before,*::after{box-shadow:none!important;}
  html,body{
    height:100%;width:100%;overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
    font-size:18px;line-height:1.3;
    display:flex;flex-direction:column;height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select,label{font:inherit;color:inherit;}
  button{cursor:pointer;}

  /* TOPBAR */
  .topbar{flex:0 0 auto;position:relative;background:var(--bg);}
  .strip{display:flex;border-bottom:1px solid var(--border);align-items:stretch;}
  .strip.strip0{height:54px;align-items:center;padding-right:4px;}
  .strip.strip1{height:42px;}
  .strip > .cell{
    flex:1 1 0;min-width:0;
    border:none;border-right:1px solid var(--border);
    background:var(--bg);color:var(--fg);
    font-size:18px;font-weight:700;letter-spacing:.4px;
    display:flex;align-items:center;justify-content:center;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;font-family:inherit;
    user-select:none;-webkit-user-select:none;
    padding:0 6px;height:100%;
  }
  /* Strip 0 cells: 2-line "STEP N / NAME" layout */
  .strip0 > .cell{
    flex-direction:column;
    line-height:1;
    padding:4px 4px;
    gap:2px;
  }
  .strip0 > .cell small{
    font-size:11px;font-weight:500;letter-spacing:1.2px;opacity:.65;
  }
  .strip0 > .cell strong{
    font-size:17px;font-weight:800;letter-spacing:.3px;
  }
  .strip0 > .cell.active{background:var(--accent);color:var(--accent-fg);}
  .strip0 > .cell.active small{opacity:1;}
  .strip1 > .cell{background:var(--panel);font-weight:600;}
  .strip1 > .cell.primary,
  .strip1 > .cell.active{background:var(--accent);color:var(--accent-fg);}
  /* STRIP 2 — inline text editor */
  .strip.strip2{height:46px;background:var(--panel);}
  .strip.strip2.hidden{display:none;}
  .strip2 > .ctrl{
    flex:0 0 auto;border:none;border-right:1px solid var(--border);
    background:transparent;color:var(--fg);
    padding:0 6px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    height:100%;cursor:pointer;
  }
  .strip2 > .ctrl:last-child{border-right:none;}
  .strip2 > .txt-edit{
    flex:1 1 0;min-width:0;
    padding:0 12px;font-size:20px;font-weight:600;
    text-align:left;cursor:text;outline:none;
  }
  .strip2 > .color-edit{
    flex:0 0 50px;width:50px;padding:6px;
  }
  .strip2 > .size-edit{
    flex:0 0 44px;font-size:20px;font-weight:800;letter-spacing:.5px;
  }
  .strip2 > .label-edit{
    flex:0 0 auto;padding:0 12px;font-size:15px;font-weight:700;
    letter-spacing:.5px;color:var(--muted);
  }
  .strip2 > .val-edit{
    flex:0 0 56px;padding:0 8px;font-size:17px;font-weight:700;
    color:var(--fg);justify-content:flex-end;
  }
  .strip2 > .range-edit{
    flex:1 1 0;padding:0 12px;height:100%;
    -webkit-appearance:none;appearance:none;background:transparent;
  }
  .strip2 > .range-edit::-webkit-slider-runnable-track{
    height:3px;background:var(--border);
  }
  .strip2 > .range-edit::-moz-range-track{
    height:3px;background:var(--border);
  }
  .strip2 > .range-edit::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:24px;height:24px;margin-top:-11px;
    background:var(--accent);border:1px solid var(--border);cursor:pointer;
  }
  .strip2 > .range-edit::-moz-range-thumb{
    width:24px;height:24px;
    background:var(--accent);border:1px solid var(--border);cursor:pointer;
  }
  .strip2 > .ctrl:disabled{opacity:.4;}
  .strip > .cell:disabled,
  .strip > .cell.is-disabled{opacity:.35;pointer-events:none;}
  .strip > .cell:last-child{border-right:none;}
  /* HAMBURGER — small 1:1 square, separated from others */
  .menu-btn{
    flex:0 0 34px;width:34px;height:34px;
    align-self:center;
    border:1px solid var(--border);
    background:var(--bg);color:var(--fg);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
    padding:0;cursor:pointer;
    margin-left:8px;
  }
  .menu-btn span{display:block;width:18px;height:2px;background:var(--fg);}
  .menu-panel{
    position:absolute;top:54px;right:0;
    width:300px;max-width:92vw;
    background:var(--bg);border:1px solid var(--border);border-top:none;
    z-index:60;display:none;max-height:80dvh;overflow-y:auto;
  }
  .menu-panel.open{display:block;}
  .menu-row{
    padding:14px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .menu-row:last-child{border-bottom:none;}
  .menu-label{font-size:20px;font-weight:600;}
  .toggle-group{display:flex;}
  .toggle-group button{
    border:1px solid var(--border);background:var(--bg);color:var(--fg);
    padding:10px 16px;font-size:18px;border-right:none;min-width:60px;font-weight:700;
  }
  .toggle-group button:last-child{border-right:1px solid var(--border);}
  .toggle-group button.active{background:var(--accent);color:var(--accent-fg);}
  .menu-row .full-btn{
    display:block;width:100%;
    border:1px solid var(--border);background:var(--bg);color:var(--fg);
    padding:14px;font-size:20px;text-align:center;font-weight:700;
    cursor:pointer;box-sizing:border-box;
  }
  .menu-row.stack{flex-direction:column;align-items:stretch;}
  .menu-row.copyright{
    padding:12px 14px;font-size:12px;color:var(--muted);
    justify-content:center;letter-spacing:.5px;text-align:center;
    flex-wrap:wrap;
  }
  .menu-row.copyright a{color:var(--muted);}
  .lib-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .lib-thumb{
    width:54px;height:54px;border:1px solid var(--border);background:var(--panel);
    background-size:contain;background-position:center;background-repeat:no-repeat;position:relative;
  }
  .lib-thumb .x{
    position:absolute;top:0;right:0;width:20px;height:20px;
    background:var(--bg);color:var(--fg);border:1px solid var(--border);
    font-size:15px;line-height:18px;text-align:center;padding:0;
  }
  .lib-empty{font-size:16px;color:var(--muted);padding:6px 0 0;}

  .hidden-input{
    position:absolute;left:-99999px;top:0;
    width:1px;height:1px;opacity:0;pointer-events:none;
  }

  /* STAGE */
  .stage{flex:1 1 auto;position:relative;overflow:hidden;background:var(--panel);min-height:0;}
  .canvas{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:#ffffff;overflow:hidden;touch-action:none;
  }
  .canvas img.bg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
  .item{position:absolute;border:1px dashed transparent;touch-action:none;user-select:none;-webkit-user-select:none;}
  .item.selected{border-color:var(--select);}
  .item img{width:100%;height:100%;display:block;pointer-events:none;}
  .item img.cover{object-fit:cover;}
  .item .text-content{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    text-align:center;word-break:break-word;overflow:hidden;
    padding:2px;pointer-events:none;line-height:1.1;
  }
  .item .handle{
    position:absolute;width:20px;height:20px;
    background:var(--bg);border:2px solid var(--select);display:none;
  }
  .item.selected .handle{display:block;}
  .item .h-br{bottom:-10px;right:-10px;cursor:nwse-resize;}
  .item .h-del{
    top:-10px;right:-10px;background:var(--select);border-color:var(--select);color:#fff;
    font-size:15px;line-height:16px;text-align:center;font-weight:700;
  }

  /* EMPTY STATE — tappable label + animated hint */
  .empty{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px;color:var(--fg);
    font-size:24px;font-weight:700;letter-spacing:.5px;
    cursor:pointer;
    animation:tap-hint 1.8s ease-in-out infinite;
  }
  .empty::after{
    content:"";position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:74%;max-width:340px;height:90px;
    border:2px dashed var(--accent);
    pointer-events:none;
    animation:tap-hint-frame 1.8s ease-in-out infinite;
  }
  @keyframes tap-hint{
    0%,100%{opacity:.65;}
    50%{opacity:1;}
  }
  @keyframes tap-hint-frame{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.55;}
    50%    {transform:translate(-50%,-50%) scale(1.04);opacity:1;}
  }

  /* THUMBS */
  .thumbs{
    flex:0 0 auto;height:56px;border-top:1px solid var(--border);
    display:flex;overflow-x:auto;padding:5px;gap:5px;background:var(--bg);
  }
  .thumbs.hidden{display:none;}
  .thumb{
    height:46px;width:46px;border:1px solid var(--border);
    object-fit:cover;flex:0 0 auto;background:var(--panel);
  }
  .thumb.active{outline:2px solid var(--accent);outline-offset:-2px;}

  /* MODAL */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center;
    z-index:200;padding:14px;
  }
  .modal.open{display:flex;}
  .modal-box{
    background:var(--bg);color:var(--fg);border:1px solid var(--border);
    width:100%;max-width:400px;max-height:90dvh;overflow-y:auto;
  }
  .modal-head{padding:16px;border-bottom:1px solid var(--border);font-size:20px;font-weight:700;letter-spacing:1px;}
  .modal-body{padding:16px;display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:18px;font-weight:600;margin-bottom:6px;}
  .field textarea,.field input[type="text"]{
    width:100%;border:1px solid var(--border);background:var(--bg);color:var(--fg);
    padding:12px;font-size:20px;
  }
  .field textarea{min-height:72px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field input[type="color"]{width:100%;height:44px;border:1px solid var(--border);background:var(--bg);padding:2px;}
  .field input[type="range"]{width:100%;}
  .modal-foot{padding:16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
  .modal-foot button{
    border:1px solid var(--border);background:var(--bg);color:var(--fg);
    padding:12px 20px;font-weight:700;font-size:19px;letter-spacing:.5px;
  }
  .modal-foot button.primary{background:var(--accent);color:var(--accent-fg);}

  .pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pick-grid button{
    aspect-ratio:1/1;border:1px solid var(--border);background:var(--panel);
    background-size:contain;background-position:center;background-repeat:no-repeat;padding:0;
  }

  .toast{
    position:fixed;left:50%;bottom:60px;transform:translateX(-50%);
    background:var(--accent);color:var(--accent-fg);padding:12px 18px;font-size:18px;
    border:1px solid var(--border);z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;
    font-weight:700;letter-spacing:.5px;
  }
  .toast.show{opacity:1;}

  /* VIDEO THUMB BADGE */
  .thumb-wrap{position:relative;flex:0 0 auto;}
  .thumb-wrap .vbadge{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .thumb-wrap .vbadge::after{
    content:"";width:0;height:0;
    border-left:7px solid #fff;
    border-top:5px solid transparent;border-bottom:5px solid transparent;
    margin-left:2px;
  }

  /* ENCODING OVERLAY (during video export) */
  .enc-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    display:none;align-items:center;justify-content:center;flex-direction:column;
    z-index:400;color:#fff;gap:18px;
  }
  .enc-overlay.show{display:flex;}
  .enc-overlay .spinner{
    width:42px;height:42px;border:3px solid rgba(255,255,255,.25);
    border-top-color:var(--accent);border-radius:50%;
    animation:enc-spin 0.9s linear infinite;
  }
  .enc-overlay .label{
    font-size:18px;font-weight:700;letter-spacing:.6px;
  }
  .enc-overlay .bar{
    width:220px;height:6px;background:rgba(255,255,255,.2);overflow:hidden;
  }
  .enc-overlay .bar > i{
    display:block;height:100%;width:0%;background:var(--accent);transition:width .15s linear;
  }
  @keyframes enc-spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="topbar" id="topbar">
    <div class="strip strip0" id="strip0">
      <button class="cell active" data-mode="photo" type="button" data-i18n="modePhoto">PHOTO</button>
      <button class="cell"        data-mode="mark"  type="button" data-i18n="modeMark">MARK</button>
      <button class="cell"        data-mode="text"  type="button" data-i18n="modeText">TEXT</button>
      <button class="cell"        data-mode="share" type="button" data-i18n="modeShare">SHARE</button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-panel" id="menuPanel">
        <div class="menu-row">
          <span class="menu-label" data-i18n="language">Language</span>
          <div class="toggle-group" id="langToggle">
            <button data-lang="en">ENGLISH</button>
            <button data-lang="zh" class="active">繁</button>
          </div>
        </div>
        <div class="menu-row">
          <span class="menu-label" data-i18n="theme">Theme</span>
          <div class="toggle-group" id="themeToggle">
            <button data-theme="light" data-i18n="light">LIGHT</button>
            <button data-theme="dark" class="active" data-i18n="dark">DARK</button>
          </div>
        </div>
        <div class="menu-row stack">
          <label class="full-btn" for="fileWm" data-i18n="uploadWatermarks">UPLOAD WATERMARKS</label>
          <div class="lib-list" id="wmList"></div>
        </div>
        <div class="menu-row copyright">
          <span>&copy; 2026 13STUDIO &middot; <a href="https://13studio.co" target="_blank" rel="noopener">13studio.co</a> &middot; v0.1.0</span>
        </div>
      </div>
    </div>
    <div class="strip strip1" id="strip1"></div>
    <div class="strip strip2 hidden" id="strip2"></div>
  </div>

  <div class="stage" id="stage">
    <div class="canvas" id="canvas" style="display:none;">
      <img class="bg" id="bgImg" alt="">
      <video class="bg" id="bgVideo" style="display:none;width:100%;height:100%;object-fit:contain;pointer-events:none;" playsinline muted loop autoplay></video>
    </div>
    <label class="empty" id="emptyState" for="fileAlbum" data-i18n="emptyHint">Tap to select a photo or video</label>
  </div>

  <div class="thumbs hidden" id="thumbs"></div>

  <input type="file" id="fileAlbum"  accept="image/*,video/*" multiple class="hidden-input">
  <input type="file" id="fileFolder" accept="image/*,video/*" multiple webkitdirectory class="hidden-input">
  <input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden-input">
  <input type="file" id="fileVideo"  accept="video/*" capture="environment" class="hidden-input">
  <input type="file" id="fileWm"     accept="image/*" class="hidden-input">

  <!-- text modal removed: text editing now lives inline on strip2 -->

  <div class="modal" id="pickWmModal">
    <div class="modal-box">
      <div class="modal-head" data-i18n="pickWatermark">PICK A WATERMARK</div>
      <div class="modal-body">
        <div class="pick-grid" id="pickWmList"></div>
      </div>
      <div class="modal-foot">
        <button id="pickWmCancel" data-i18n="cancel">CANCEL</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="enc-overlay" id="encOverlay">
    <div class="spinner"></div>
    <div class="label" id="encLabel" data-i18n="encodingVideo">Encoding video…</div>
    <div class="bar"><i id="encBar"></i></div>
  </div>

function fileToDataURL(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f);});}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();if(!src.startsWith("data:")) i.crossOrigin="anonymous";i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function loadVideo(src){
  return new Promise((res,rej)=>{
    const v=document.createElement("video");
    v.muted=true; v.playsInline=true; v.preload="metadata"; v.crossOrigin="anonymous";
    v.onloadedmetadata=()=>res(v);
    v.onerror=()=>rej(new Error("video load error"));
    v.src=src;
  });
}
// Capture a still frame from a video as a PNG data URL (used for thumbnails and contrast probing)
function captureVideoFrame(videoEl, atSec=0){
  return new Promise((res,rej)=>{
    const v=document.createElement("video");
    v.muted=true; v.playsInline=true; v.crossOrigin="anonymous";
    v.src=videoEl.src || videoEl.currentSrc;
    const onReady=()=>{
      v.removeEventListener("seeked",onReady);
      v.removeEventListener("loadeddata",seek);
      try{
        const c=document.createElement("canvas");
        c.width=v.videoWidth||320; c.height=v.videoHeight||180;
        const ctx=c.getContext("2d");
        ctx.drawImage(v,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.82));
      }catch(e){ rej(e); }
    };
    const seek=()=>{
      try{
        const t=Math.min(Math.max(0,atSec), Math.max(0,(v.duration||0)-0.05));
        v.currentTime=t;
      }catch(_){ onReady(); }
    };
    v.addEventListener("loadeddata",seek,{once:true});
    v.addEventListener("seeked",onReady,{once:true});
    v.addEventListener("error",()=>rej(new Error("frame capture failed")),{once:true});
  });
}

async function autoContrastColor(photo,xPct,yPct,wPct,hPct){
  try{
    // For videos, use the poster frame for contrast probing.
    const probeSrc = (photo.mediaType==="video") ? (photo.posterSrc || photo.src) : photo.src;
    if(probeSrc && photo.mediaType!=="video"){
      const img=await loadImage(probeSrc);
      const c=document.createElement("canvas");
      const W=120, H=Math.max(20,Math.round(120*photo.natH/photo.natW));
      c.width=W; c.height=H;
      const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,W,H);
      const sx=Math.max(0,Math.min(W-1,Math.floor(xPct*W)));
      const sy=Math.max(0,Math.min(H-1,Math.floor(yPct*H)));
      const sw=Math.max(1,Math.min(W-sx,Math.ceil(wPct*W)));
      const sh=Math.max(1,Math.min(H-sy,Math.ceil(hPct*H)));
      const data=ctx.getImageData(sx,sy,sw,sh).data;
      let sum=0, n=0;
      for(let i=0;i<data.length;i+=4){ sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]; n++; }
      return (sum/n) > 140 ? "#000000" : "#ffffff";
    } else if(probeSrc && photo.mediaType==="video"){
      // Probe using the cached poster image
      const img=await loadImage(probeSrc);
      const c=document.createElement("canvas");
      const W=120, H=Math.max(20,Math.round(120*photo.natH/photo.natW));
      c.width=W; c.height=H;
      const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,W,H);
      const sx=Math.max(0,Math.min(W-1,Math.floor(xPct*W)));
      const sy=Math.max(0,Math.min(H-1,Math.floor(yPct*H)));
      const sw=Math.max(1,Math.min(W-sx,Math.ceil(wPct*W)));
      const sh=Math.max(1,Math.min(H-sy,Math.ceil(hPct*H)));
      const data=ctx.getImageData(sx,sy,sw,sh).data;
      let sum=0, n=0;
      for(let i=0;i<data.length;i+=4){ sum += 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]; n++; }
      return (sum/n) > 140 ? "#000000" : "#ffffff";
    }
  }catch(_){}
  return "#ffffff";
}

function renderStrip2(){
  const s = $("#strip2"); if(!s) return;
  s.innerHTML = "";
  const p = activePhoto();
  if(!p){ s.classList.add("hidden"); return; }

  if(state.mode === "text"){
    // -- TEXT EDITOR --
    let item = p.items.find(x => x.id === state.selectedItemId && x.type === "text");
    if(!item){
      const texts = p.items.filter(x => x.type === "text");
      if(texts.length) item = texts[texts.length - 1];
    }
    if(!item){ s.classList.add("hidden"); return; }
    s.classList.remove("hidden");
    state.selectedItemId = item.id;

    const txt = document.createElement("input");
    txt.type = "text"; txt.className = "ctrl txt-edit";
    txt.value = item.text || "";
    txt.placeholder = state.lang==="zh" ? "輸入文字" : "Type your text";
    txt.addEventListener("input", e => { item.text = e.target.value; renderItems(); });
    s.appendChild(txt);

    const col = document.createElement("input");
    col.type = "color"; col.className = "ctrl color-edit";
    col.value = (item.color && /^#[0-9a-f]{6}$/i.test(item.color)) ? item.color : "#ffffff";
    col.addEventListener("input", e => { item.color = e.target.value; renderItems(); });
    s.appendChild(col);

    const minus = document.createElement("button");
    minus.type = "button"; minus.className = "ctrl size-edit"; minus.textContent = "A−";
    minus.addEventListener("click", () => {
      item.fontSize = Math.max(10, (item.fontSize||36) - 6);
      renderItems();
    });
    s.appendChild(minus);
    const plus = document.createElement("button");
    plus.type = "button"; plus.className = "ctrl size-edit"; plus.textContent = "A+";
    plus.addEventListener("click", () => {
      item.fontSize = Math.min(160, (item.fontSize||36) + 6);
      renderItems();
    });
    s.appendChild(plus);
    return;
  }

  if(state.mode === "mark"){
    // -- MARK / OPACITY EDITOR --
    let item = p.items.find(x => x.id === state.selectedItemId && x.type === "watermark");
    if(!item){
      const wms = p.items.filter(x => x.type === "watermark");
      if(wms.length) item = wms[wms.length - 1];
    }
    if(!item){ s.classList.add("hidden"); return; }
    s.classList.remove("hidden");
    state.selectedItemId = item.id;

    const lbl = document.createElement("span"); lbl.className = "ctrl label-edit";
    lbl.textContent = state.lang==="zh" ? "透明度" : "OPACITY";
    s.appendChild(lbl);

    const val = document.createElement("span"); val.className = "ctrl val-edit";
    const startPct = Math.round((item.alpha??DEFAULT_WM_ALPHA)*100);
    val.textContent = startPct + "%";

    const range = document.createElement("input");
    range.type = "range"; range.className = "ctrl range-edit";
    range.min = "10"; range.max = "100"; range.step = "1";
    range.value = startPct;
    const update = (v)=>{
      item.alpha = parseInt(v,10)/100;
      val.textContent = v + "%";
      // Mirror to default config so subsequent photos use the same alpha
      if(item._fromDefault && state.defaultWmConfig){
        state.defaultWmConfig.alpha = item.alpha;
        propagateWatermarkPosition();
      }
      renderItems();
    };
    range.addEventListener("input", e => update(e.target.value));
    s.appendChild(range);
    s.appendChild(val);
    return;
  }

  s.classList.add("hidden");
}

function makeCell({text, onClick, asLabel, primary, disabled, active}){
  const el = asLabel
    ? Object.assign(document.createElement("label"), {htmlFor: asLabel})
    : Object.assign(document.createElement("button"), {type:"button"});
  el.className = "cell" + (primary?" primary":"") + (disabled?" is-disabled":"") + (active?" active":"");
  el.textContent = text;
  if(onClick && !asLabel) el.addEventListener("click", onClick);
  return el;
}

const stage=$("#stage"), canvas=$("#canvas"), bgImg=$("#bgImg"), bgVideo=$("#bgVideo");
function activePhoto(){ return state.photos[state.activeIdx]; }

function refreshStage(){
  const has = state.activeIdx>=0;
  $("#emptyState").style.display = has ? "none" : "flex";
  $("#canvas").style.display = has ? "" : "none";
  $("#thumbs").classList.toggle("hidden", !(has && state.photos.length>1));
  if(has) fitCanvas();
}

["fileAlbum","fileFolder","fileCamera","fileVideo"].forEach(id=>{
  $("#"+id).addEventListener("change",e=>handleFiles(e.target.files,e.target));
});
const MAX_VIDEO_SECONDS = 60;
async function handleFiles(files,input){
  const list=[...files].filter(f=>f.type.startsWith("image/") || f.type.startsWith("video/"));
  if(!list.length){ if(input) input.value=""; return; }
  for(const f of list){
    const isVideo = f.type.startsWith("video/");
    const src=await fileToDataURL(f);
    let photo;
    if(isVideo){
      try{
        const v=await loadVideo(src);
        if(v.duration && v.duration > MAX_VIDEO_SECONDS){
          toast(I18N[state.lang].videoTooLong);
          continue;
        }
        let poster=null;
        try{ poster = await captureVideoFrame(v, 0); }catch(_){}
        photo={
          id:uid(), src,
          mediaType:"video",
          natW: v.videoWidth || 1280,
          natH: v.videoHeight || 720,
          duration: v.duration || 0,
          posterSrc: poster,
          items:[]
        };
      }catch(_){
        // Fallback: skip on hard failure
        continue;
      }
    } else {
      const img=await loadImage(src);
      photo={id:uid(),src,mediaType:"photo",natW:img.naturalWidth,natH:img.naturalHeight,items:[]};
    }
    applySeedsToPhoto(photo);
    state.photos.push(photo);
  }
  state.activeIdx = state.activeIdx<0 ? 0 : state.activeIdx;
  loadActive(); renderThumbs(); renderStrip1(); renderStrip2(); refreshStage();
  if(input) input.value="";
}

function applySeedsToPhoto(photo){
  // Initialize seedConfigs on first call (per session, in-memory only)
  if(!state.seedConfigs){
    state.seedConfigs = {};
    for(const seed of SEED_WMS){
      const entry = DEFAULT_WATERMARKS.find(w => w.id === seed.id);
      if(!entry) continue;
      const wPct = seed.wPct;
      const hPct = wPct * (photo.natW / photo.natH) / entry.ar;
      const xPct = 0.5 - wPct/2;
      const yPct = (seed.pos==="top") ? 0.04 : Math.max(0.04, 1 - hPct - 0.04);
      state.seedConfigs[seed.id] = {
        src: entry.src, ar: entry.ar, alpha: DEFAULT_WM_ALPHA,
        xPct, yPct, wPct
      };
    }
  }
  // Apply each seed config to the photo; hPct is derived per-photo from its AR
  for(const seedKey in state.seedConfigs){
    const cfg = state.seedConfigs[seedKey];
    const hPct = cfg.wPct * (photo.natW / photo.natH) / cfg.ar;
    photo.items.push({
      id: uid(), type:"watermark",
      src: cfg.src, ar: cfg.ar, alpha: cfg.alpha,
      xPct: cfg.xPct, yPct: cfg.yPct, wPct: cfg.wPct, hPct,
      _seedKey: seedKey, _fromDefault: true
    });
  }
}
function cloneItemFromDefault(cfg){
  return {id:uid(),type:"watermark",src:cfg.src,alpha:cfg.alpha,ar:cfg.ar,
    xPct:cfg.xPct,yPct:cfg.yPct,wPct:cfg.wPct,hPct:cfg.hPct,_fromDefault:true};
}

function loadActive(){
  const p=activePhoto();
  if(!p){ canvas.style.display="none"; return; }
  canvas.style.display="";
  // Pause any previously-playing video first
  try{ bgVideo.pause(); }catch(_){}
  if(p.mediaType === "video"){
    bgImg.style.display="none";
    bgVideo.style.display="";
    if(bgVideo.src !== p.src){ bgVideo.src = p.src; }
    bgVideo.muted = true;
    bgVideo.loop  = true;
    bgVideo.playsInline = true;
    // Attempt autoplay (muted, so allowed on mobile)
    const tryPlay = ()=>{ const pr = bgVideo.play(); if(pr && pr.catch) pr.catch(()=>{}); };
    tryPlay();
    canvas.style.background="#000000";
  } else if(p.src){
    bgVideo.style.display="none";
    bgImg.src=p.src; bgImg.style.display="";
    canvas.style.background="#ffffff";
  } else {
    bgImg.style.display="none";
    bgVideo.style.display="none";
    canvas.style.background="#ffffff";
  }
  fitCanvas(); renderItems();
}
function fitCanvas(){
  const p=activePhoto(); if(!p) return;
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const ar=p.natW/p.natH;
  let w=sw, h=sw/ar;
  if(h>sh){ h=sh; w=sh*ar; }
  w*=0.95; h*=0.95;
  canvas.style.width=w+"px"; canvas.style.height=h+"px";
}
window.addEventListener("resize",()=>fitCanvas());

function renderItems(){
  canvas.querySelectorAll(".item").forEach(n=>n.remove());
  const p=activePhoto(); if(!p) return;
  p.items.forEach(it=>{
    const el=document.createElement("div");
    el.className="item"; el.dataset.id=it.id;
    if(it.id===state.selectedItemId) el.classList.add("selected");
    positionItem(el,it);
    if(it.type==="watermark"){
      const im=document.createElement("img"); im.src=it.src; im.style.opacity=it.alpha;
      el.appendChild(im);
    } else if(it.type==="text"){
      const tx=document.createElement("div"); tx.className="text-content";
      tx.textContent=it.text||""; tx.style.color=it.color;
      tx.style.opacity=it.alpha; tx.style.fontSize=it.fontSize+"px"; tx.style.fontWeight="700";
      el.appendChild(tx);
    }
    const hbr=document.createElement("div"); hbr.className="handle h-br"; el.appendChild(hbr);
    const hdel=document.createElement("button"); hdel.className="handle h-del"; hdel.textContent="×"; el.appendChild(hdel);
    canvas.appendChild(el);
    attachItemHandlers(el,it,hbr,hdel);
  });
}
function positionItem(el,it){
  el.style.left=(it.xPct*100)+"%";
  el.style.top=(it.yPct*100)+"%";
  el.style.width=(it.wPct*100)+"%";
  el.style.height=(it.hPct*100)+"%";
}

function attachItemHandlers(el,it,hbr,hdel){
  let mode=null,sx=0,sy=0,start=null,lastTap=0,moved=0;
  const onDown=(e)=>{
    if(e.target===hdel){
      e.stopPropagation();
      if(confirm(I18N[state.lang].deleteConfirm)) deleteItem(it.id);
      return;
    }
    e.preventDefault();
    state.selectedItemId=it.id;
    canvas.querySelectorAll(".item").forEach(n=>n.classList.remove("selected"));
    el.classList.add("selected");
    const rect=canvas.getBoundingClientRect();
    sx=e.clientX; sy=e.clientY; moved=0;
    start={x:it.xPct,y:it.yPct,w:it.wPct,h:it.hPct,cw:rect.width,ch:rect.height};
    mode = (e.target===hbr) ? "resize" : "drag";
    el.setPointerCapture(e.pointerId);
    // Refresh strip2 whenever selection changes so the editor binds to the tapped item
    if((it.type==="text"      && state.mode==="text") ||
       (it.type==="watermark" && state.mode==="mark")){
      renderStrip2();
    }
  };
  const onMove=(e)=>{
    if(!mode) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    const p=activePhoto();
    if(mode==="drag"){
      let newX=Math.max(-it.wPct*0.5,Math.min(1-it.wPct*0.5,start.x+dx/start.cw));
      const newY=Math.max(-it.hPct*0.5,Math.min(1-it.hPct*0.5,start.y+dy/start.ch));
      const itemCenter = newX + it.wPct/2;
      if(Math.abs(itemCenter - 0.5) < SNAP_MARGIN){
        newX = 0.5 - it.wPct/2;
      }
      it.xPct=newX; it.yPct=newY;
    } else {
      if(it.type==="watermark" && it.ar && p){
        const newW=Math.max(0.05,Math.min(2,start.w+dx/start.cw));
        it.wPct=newW;
        it.hPct=newW * (p.natW/p.natH) / it.ar;
      } else {
        it.wPct=Math.max(0.05,Math.min(2,start.w+dx/start.cw));
        it.hPct=Math.max(0.04,Math.min(2,start.h+dy/start.ch));
      }
    }
    positionItem(el,it);
  };
  const onUp=(e)=>{
    if(mode && it.type==="watermark" && it._seedKey){
      updateDefaultFromItem(it);
      propagateWatermarkPosition(it._seedKey);
    }
    mode=null;
    try{el.releasePointerCapture(e.pointerId);}catch(_){}
  };
  el.addEventListener("pointerdown",onDown);
  el.addEventListener("pointermove",onMove);
  el.addEventListener("pointerup",onUp);
  el.addEventListener("pointercancel",onUp);
}
function deleteItem(id){
  const p=activePhoto(); if(!p) return;
  const target = p.items.find(i=>i.id===id);
  p.items = p.items.filter(i=>i.id!==id);
  // If we deleted a seed-derived watermark, drop the same seed from all other photos
  // (and from the seed config), so subsequent photos don't auto-restore it.
  if(target && target.type==="watermark" && target._seedKey){
    const key = target._seedKey;
    state.photos.forEach(ph=>{ ph.items = ph.items.filter(it => !(it.type==="watermark" && it._seedKey===key)); });
    if(state.seedConfigs) delete state.seedConfigs[key];
  }
  renderItems(); renderStrip1(); renderStrip2();
}
function updateDefaultFromItem(it){
  // Mirror a seed-derived watermark's current state back into the shared seedConfigs
  if(!it._seedKey) return;
  if(!state.seedConfigs) state.seedConfigs={};
  state.seedConfigs[it._seedKey] = {
    src: it.src, ar: it.ar, alpha: it.alpha,
    xPct: it.xPct, yPct: it.yPct, wPct: it.wPct
  };
}
function propagateWatermarkPosition(seedKey){
  if(!state.seedConfigs) return;
  const ap = activePhoto();
  state.photos.forEach(ph=>{
    if(ph===ap) return;
    const keys = seedKey ? [seedKey] : Object.keys(state.seedConfigs);
    for(const k of keys){
      const cfg = state.seedConfigs[k]; if(!cfg) continue;
      const target = ph.items.find(x => x.type==="watermark" && x._seedKey===k);
      const hPct = cfg.wPct * (ph.natW / ph.natH) / cfg.ar;
      if(target){
        target.src=cfg.src; target.ar=cfg.ar; target.alpha=cfg.alpha;
        target.xPct=cfg.xPct; target.yPct=cfg.yPct; target.wPct=cfg.wPct; target.hPct=hPct;
      }
    }
  });
}

function addWmFlow(){
  const p = activePhoto();
  if(p){
    const wmCount = p.items.filter(it => it.type === "watermark").length;
    if(wmCount >= MAX_WATERMARKS){ toast(I18N[state.lang].maxWms); return; }
  }
  if(!state.watermarks.length){ toast(I18N[state.lang].noWatermarks); return; }
  if(state.watermarks.length===1){ addWatermarkToActive(state.watermarks[0].src); return; }
  openWmPicker();

async function addWatermarkToActive(src){
  const p=activePhoto(); if(!p) return;
  // Prefer stored AR (defaults & user uploads keep it); fall back to image-load
  const entry = state.watermarks.find(x => x.src === src);
  let wmAR = entry && entry.ar;
  if(!wmAR){
    try{ const img = await loadImage(src); wmAR = img.naturalWidth / img.naturalHeight; }
    catch(_){ wmAR = 4.5; }
  }
  const wPct = 0.40;
  const hPct = wPct * (p.natW / p.natH) / wmAR;
  const xPct = 0.5 - wPct/2;
  const yPct = Math.max(0.04, 1 - hPct - 0.04);
  const item={id:uid(),type:"watermark",src,alpha:DEFAULT_WM_ALPHA,xPct,yPct,wPct,hPct,ar:wmAR};
  // User-added watermark — NOT a seed, no propagation. Max-cap is enforced in addWmFlow.
  p.items.push(item);
  state.selectedItemId=item.id;
 renderItems(); renderStrip2();
}

function addTextFlow(){
  const p=activePhoto(); if(!p) return;
  const wPct=0.6, hPct=0.12;
  const xPct=0.5 - wPct/2, yPct=0.45;
  const item={id:uid(),type:"text",
    text:state.lang==="zh"?"輸入文字":"Your text",
    color:"#ffffff", fontSize:36, alpha:1, xPct,yPct,wPct,hPct};
  p.items.push(item);
  state.selectedItemId=item.id;
  renderItems();
  renderStrip2();
  setTimeout(() => {
    const inp = document.querySelector("#strip2 .txt-edit");
    if(inp){ try{ inp.focus(); inp.select(); }catch(_){} }
  }, 80);
  autoContrastColor(p,xPct,yPct,wPct,hPct).then(c=>{
    if(c && item.color === "#ffffff"){
      item.color = c;
      const cp = document.querySelector("#strip2 .color-edit"); if(cp) cp.value = c;
      renderItems();

}

function renderStrip2(){
  const s = $("#strip2"); if(!s) return;
  s.innerHTML = "";
  const p = activePhoto();
  if(!p){ s.classList.add("hidden"); return; }

  if(state.mode === "text"){
    let item = p.items.find(x => x.id === state.selectedItemId && x.type === "text");
    if(!item){
      const texts = p.items.filter(x => x.type === "text");
      if(texts.length) item = texts[texts.length - 1];
    }
    if(!item){ s.classList.add("hidden"); return; }
    s.classList.remove("hidden");
    state.selectedItemId = item.id;

    const txt = document.createElement("input");
    txt.type = "text"; txt.className = "ctrl txt-edit";
    txt.value = item.text || "";

    s.appendChild(txt);

    const col = document.createElement("input");
    col.type = "color"; col.className = "ctrl color-edit";
    col.value = (item.color && /^#[0-9a-f]{6}$/i.test(item.color)) ? item.color : "#ffffff";
    col.addEventListener("input", e => { item.color = e.target.value; renderItems(); });
    s.appendChild(col);

    const minus = document.createElement("button");
    minus.type = "button"; minus.className = "ctrl size-edit"; minus.textContent = "A−";
    minus.addEventListener("click", () => {
      item.fontSize = Math.max(10, (item.fontSize||36) - 6);
      renderItems();
    });
    s.appendChild(minus);
    const plus = document.createElement("button");
    plus.type = "button"; plus.className = "ctrl size-edit"; plus.textContent = "A+";
    plus.addEventListener("click", () => {
      item.fontSize = Math.min(160, (item.fontSize||36) + 6);
      renderItems();
    });
    s.appendChild(plus);
    return;
  }

  if(state.mode === "mark"){
    let item = p.items.find(x => x.id === state.selectedItemId && x.type === "watermark");
    if(!item){
      const wms = p.items.filter(x => x.type === "watermark");
      if(wms.length) item = wms[wms.length - 1];
    }
    if(!item){ s.classList.add("hidden"); return; }
    s.classList.remove("hidden");
    state.selectedItemId = item.id;

    const lbl = document.createElement("span"); lbl.className = "ctrl label-edit";
    lbl.textContent = state.lang==="zh" ? "透明度" : "OPACITY";
    s.appendChild(lbl);

    const val = document.createElement("span"); val.className = "ctrl val-edit";
    const startPct = Math.round((item.alpha??DEFAULT_WM_ALPHA)*100);
    val.textContent = startPct + "%";

    const range = document.createElement("input");
    range.type = "range"; range.className = "ctrl range-edit";
    range.min = "10"; range.max = "100"; range.step = "1";
    range.value = startPct;
    range.addEventListener("input", e => {
      const v = e.target.value;
      item.alpha = parseInt(v,10)/100;
      val.textContent = v + "%";
      if(item._seedKey){
        updateDefaultFromItem(item);
        propagateWatermarkPosition(item._seedKey);
      }
      renderItems();
    });
    s.appendChild(range);
    s.appendChild(val);
    return;
  }

  s.classList.add("hidden");
}

async function exportActiveBlob(){
  const p=activePhoto(); if(!p) return null;
  if(p.mediaType === "video"){
    return await exportVideoWithOverlays(p);
  }
  // -- PHOTO PATH (unchanged behavior) --
  const W=p.natW, H=p.natH;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  if(p.src){ const bg=await loadImage(p.src); ctx.drawImage(bg,0,0,W,H); }
  for(const it of p.items){
    const x=it.xPct*W, y=it.yPct*H, w=it.wPct*W, h=it.hPct*H;
    ctx.save(); ctx.globalAlpha = it.alpha ?? 1;
    if(it.type==="watermark"){
      const im=await loadImage(it.src);
      ctx.drawImage(im,x,y,w,h);
    } else if(it.type==="text"){
      const dispW=canvas.clientWidth || 1;
      const scale=W/dispW;
      const fs=it.fontSize*scale;
      ctx.fillStyle=it.color;
      ctx.font=`700 ${fs}px -apple-system,"Helvetica Neue","PingFang TC","Microsoft JhengHei",Arial,sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const lines=wrapText(ctx,it.text||"",w);
      const lh=fs*1.1, total=lines.length*lh;
      let cy=y+h/2-total/2+lh/2;
      lines.forEach(l=>{ ctx.fillText(l,x+w/2,cy); cy+=lh; });
    }
    ctx.restore();
  }
  const blob = await new Promise(res=>c.toBlob(res,"image/png"));
  return { blob, ext:"png", mime:"image/png" };
}

// Record a video (with watermarks + text baked in) from the active photo state.
// Strategy: an offscreen <video> playing the source, drawn into an offscreen canvas
// each frame along with overlays. Canvas.captureStream feeds a MediaRecorder.
// Audio (if present) is taken from the offscreen video element's audio track.
function showEnc(show){
  const o=$("#encOverlay"); if(!o) return;
  o.classList.toggle("show", !!show);
  if(!show){ const b=$("#encBar"); if(b) b.style.width="0%"; }
}
function setEncProgress(pct){
  const b=$("#encBar"); if(b) b.style.width=Math.max(0,Math.min(100,pct))+"%";
}
function pickRecorderMime(){
  const cands=[
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm",
    "video/mp4;codecs=h264,aac",
    "video/mp4"
  ];
  for(const m of cands){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  }
  return "";
}
async function exportVideoWithOverlays(p){
  if(!window.MediaRecorder){
    // Fallback: snapshot current frame as PNG
    return await snapshotVideoFrameAsPng(p);
  }
  showEnc(true); setEncProgress(0);

  // Offscreen video (independent of preview so playback isn't fighting the UI)
  const off=document.createElement("video");
  off.src=p.src; off.muted=false; off.playsInline=true; off.crossOrigin="anonymous";
  await new Promise((res,rej)=>{
    off.onloadedmetadata=()=>res();
    off.onerror=()=>rej(new Error("video meta error"));
  });
  // Some browsers need a paint tick to grab dimensions
  const W = off.videoWidth || p.natW || 1280;
  const H = off.videoHeight || p.natH || 720;
  // Pre-load watermark images
  const wmCache = new Map();
  for(const it of p.items){
    if(it.type==="watermark" && !wmCache.has(it.src)){
      try{ wmCache.set(it.src, await loadImage(it.src)); }catch(_){}
    }
  }
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");

  const fps=30;
  const stream=c.captureStream(fps);
  // Mix in audio from the source video if any audio tracks are exposed
  let audioCleanup=null;
  try{
    if(off.captureStream){
      const vstream=off.captureStream();
      const atracks=vstream.getAudioTracks();
      atracks.forEach(t=>stream.addTrack(t));
      audioCleanup=()=>atracks.forEach(t=>{ try{t.stop();}catch(_){}});
    } else if(off.mozCaptureStream){
      const vstream=off.mozCaptureStream();
      const atracks=vstream.getAudioTracks();
      atracks.forEach(t=>stream.addTrack(t));
      audioCleanup=()=>atracks.forEach(t=>{ try{t.stop();}catch(_){}});
    }
  }catch(_){ /* audio capture not supported; record video only */ }

  const mime=pickRecorderMime();
  let rec;
  try{
    rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  }catch(_){
    showEnc(false);
    return await snapshotVideoFrameAsPng(p);
  }
  const chunks=[];
  rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  const done = new Promise(res => { rec.onstop = () => res(); });

  // Draw loop: render current video frame + overlays into canvas
  let stopped=false;
  function drawFrame(){
    if(stopped) return;
    try{ ctx.drawImage(off, 0, 0, W, H); }catch(_){}
    for(const it of p.items){
      const x=it.xPct*W, y=it.yPct*H, w=it.wPct*W, h=it.hPct*H;
      ctx.save(); ctx.globalAlpha = it.alpha ?? 1;
      if(it.type==="watermark"){
        const im = wmCache.get(it.src);
        if(im){ ctx.drawImage(im, x, y, w, h); }
      } else if(it.type==="text"){
        const dispW = canvas.clientWidth || 1;
        const scale = W / dispW;
        const fs = (it.fontSize || 36) * scale;
        ctx.fillStyle = it.color || "#ffffff";
        ctx.font = `700 ${fs}px -apple-system,"Helvetica Neue","PingFang TC","Microsoft JhengHei",Arial,sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        const lines = wrapText(ctx, it.text || "", w);
        const lh = fs * 1.1, total = lines.length * lh;
        let cy = y + h/2 - total/2 + lh/2;
        lines.forEach(l => { ctx.fillText(l, x + w/2, cy); cy += lh; });
      }
      ctx.restore();
    }
    if(off.duration > 0){
      const pct = Math.round(100 * Math.min(1, off.currentTime / off.duration));
      setEncProgress(pct);
    }
    requestAnimationFrame(drawFrame);
  }

  await new Promise((res,rej)=>{
    off.onended = () => res();
    off.onerror = () => rej(new Error("video play error"));
    off.currentTime = 0;
    off.play().then(()=>{
      rec.start(100);
      requestAnimationFrame(drawFrame);
    }).catch(rej);
  }).catch(()=>{});

  stopped = true;
  try{ rec.state !== "inactive" && rec.stop(); }catch(_){}
  await done;
  if(audioCleanup) audioCleanup();
  showEnc(false);

  const blobMime = (rec.mimeType || mime || "video/webm").split(";")[0];
  const ext = blobMime.includes("mp4") ? "mp4" : "webm";
  const blob = new Blob(chunks, { type: blobMime });
  return { blob, ext, mime: blobMime };
}

// Fallback when MediaRecorder isn't available: export current frame as PNG.
async function snapshotVideoFrameAsPng(p){
  const W=p.natW, H=p.natH;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  try{ ctx.drawImage(bgVideo, 0, 0, W, H); }
  catch(_){ if(p.posterSrc){ const im=await loadImage(p.posterSrc); ctx.drawImage(im,0,0,W,H); } }
  for(const it of p.items){
    const x=it.xPct*W, y=it.yPct*H, w=it.wPct*W, h=it.hPct*H;
    ctx.save(); ctx.globalAlpha = it.alpha ?? 1;
    if(it.type==="watermark"){
      const im=await loadImage(it.src);
      ctx.drawImage(im,x,y,w,h);
    } else if(it.type==="text"){
      const dispW=canvas.clientWidth || 1;
      const scale=W/dispW;
      const fs=it.fontSize*scale;
      ctx.fillStyle=it.color;
      ctx.font=`700 ${fs}px -apple-system,"Helvetica Neue","PingFang TC","Microsoft JhengHei",Arial,sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      const lines=wrapText(ctx,it.text||"",w);
      const lh=fs*1.1, total=lines.length*lh;
      let cy=y+h/2-total/2+lh/2;
      lines.forEach(l=>{ ctx.fillText(l,x+w/2,cy); cy+=lh; });
    }
    ctx.restore();
  }
  const blob = await new Promise(res=>c.toBlob(res,"image/png"));
  return { blob, ext:"png", mime:"image/png" };
}
function wrapText(ctx,text,maxW){
  const words=(text||"").split(/(\s+)/);
  const lines=[]; let cur="";
  for(const w of words){
    const t=cur+w;
    if(ctx.measureText(t).width>maxW && cur){ lines.push(cur.trimEnd()); cur=w.trimStart(); }
    else cur=t;
  }
  if(cur) lines.push(cur);
  return lines.length?lines:[""];
}

async function shareFlow(){
  const result = await exportActiveBlob(); if(!result) return;
  const { blob, ext, mime } = result;
  const fname = "project-pe." + ext;
  const file = new File([blob], fname, { type: mime });
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"PROJECT-PE"}); toast(I18N[state.lang].sharedOk); return; }
    catch(err){ if(err && err.name==="AbortError") return; }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast(I18N[state.lang].savedOk);
}

applyI18N(); applyTheme(); renderLib(); renderStrip1(); renderStrip2(); refreshStage();
window.addEventListener("orientationchange",()=>setTimeout(fitCanvas,200));
